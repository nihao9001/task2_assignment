<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CodeTrack - ReactJS coding practice tracker for Task 2." />
  <title>CodeTrack | Coding Practice Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#68738a;--line:#e6eaf1;--accent:#4f46e5;--accent2:#3730a3;--good:#16824a;--warn:#b7791f;--bad:#c0392b;--shadow:0 12px 32px rgba(23,32,51,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)} button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#111827;color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:24px}.brand{font-size:22px;font-weight:800;letter-spacing:-.04em}.brand span{color:#a5b4fc}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#aeb6c8;text-align:left;padding:11px 12px;border-radius:10px}.nav button.active,.nav button:hover{background:#202a3b;color:#fff}.side-note{margin-top:auto;font-size:12px;line-height:1.5;color:#95a0b5}
    .main{padding:30px;max-width:1400px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:800}.title{font-size:32px;line-height:1.1;margin:5px 0 6px;letter-spacing:-.04em}.subtitle{color:var(--muted);margin:0;max-width:760px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger{color:var(--bad)}.btn.small{padding:7px 10px;font-size:13px}
    .grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}.stat-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.stat-value{font-size:30px;font-weight:800;margin-top:8px}.stat-meta{font-size:12px;color:var(--muted);margin-top:4px}
    .two{grid-template-columns:1.2fr .8fr}.section-title{font-size:17px;font-weight:800;margin:0 0 14px}.muted{color:var(--muted)}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}.row-main{min-width:0}.row-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-main span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef2ff;color:#4338ca}.tag.good{background:#ecfdf3;color:var(--good)}.tag.warn{background:#fff7e8;color:var(--warn)}.tag.bad{background:#fff1f0;color:var(--bad)}
    .toolbar{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:10px;align-items:center;margin-bottom:14px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#9aa2ff;box-shadow:0 0 0 3px #eef2ff}.textarea{min-height:90px;resize:vertical}
    table{width:100%;border-collapse:collapse}.table-wrap{overflow:auto}.table-wrap table{min-width:820px}.table-wrap th,.table-wrap td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}.table-wrap th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.table-actions{display:flex;gap:6px}.empty{text-align:center;padding:36px;color:var(--muted)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.48);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.2);padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.modal-head h2{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.error{font-size:11px;color:var(--bad)}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .chart-list{display:grid;gap:12px}.bar-line{display:grid;grid-template-columns:110px 1fr 48px;gap:10px;align-items:center;font-size:12px}.bar{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--accent);border-radius:inherit}.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:4px auto 16px;background:conic-gradient(var(--accent) calc(var(--p)*1%),#edf0f5 0)}.ring:after{content:"";width:112px;height:112px;border-radius:50%;background:#fff;position:absolute}.ring-inner{position:relative;z-index:1;text-align:center}.ring-value{font-size:28px;font-weight:800}.ring-label{font-size:11px;color:var(--muted)}
    .footer{margin-top:20px;color:#8993a6;font-size:12px;text-align:center}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:30;font-size:13px}
    @media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:10;flex-direction:row;align-items:center;padding:12px 16px}.nav{display:flex;overflow:auto;flex:1}.side-note{display:none}.main{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}}
    @media(max-width:650px){.main{padding:16px}.top{flex-direction:column}.title{font-size:27px}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar{grid-template-columns:1fr}.toolbar .search{grid-column:auto}.actions{width:100%}.btn{flex:1}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const seed=[
 {id:1,title:'Binary Search',topic:'Searching',language:'C++',difficulty:'Medium',platform:'LeetCode',status:'Solved',date:'2026-09-28',notes:'Reviewed edge cases and loop invariants.'},
 {id:2,title:'Two Sum',topic:'Arrays',language:'C++',difficulty:'Easy',platform:'LeetCode',status:'Solved',date:'2026-09-27',notes:'Revisited hash map solution.'},
 {id:3,title:'Valid Parentheses',topic:'Stack',language:'JavaScript',difficulty:'Easy',platform:'CodeChef',status:'Solved',date:'2026-09-25',notes:'Implemented with an explicit stack.'},
 {id:4,title:'LRU Cache',topic:'Design',language:'Java',difficulty:'Hard',platform:'LeetCode',status:'In Progress',date:'',notes:'Need to finish the linked-list update logic.'},
 {id:5,title:'Merge Intervals',topic:'Sorting',language:'Python',difficulty:'Medium',platform:'HackerRank',status:'Attempted',date:'',notes:'Second pass planned after revising sorting.'},
 {id:6,title:'Graph Traversal',topic:'Graphs',language:'C++',difficulty:'Medium',platform:'Codeforces',status:'In Progress',date:'',notes:'Comparing BFS and DFS memory use.'}
];
const blank={title:'',topic:'',language:'C++',difficulty:'Easy',platform:'LeetCode',status:'In Progress',date:'',notes:''};
function load(){try{const raw=localStorage.getItem('codetrack-problems');return raw?JSON.parse(raw):seed}catch{return seed}}
function App(){
 const [items,setItems]=useState(load); const [view,setView]=useState('dashboard'); const [editing,setEditing]=useState(null); const [toast,setToast]=useState('');
 useEffect(()=>localStorage.setItem('codetrack-problems',JSON.stringify(items)),[items]);
 useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),2300);return()=>clearTimeout(t)},[toast]);
 const stats=useMemo(()=>({total:items.length,solved:items.filter(x=>x.status==='Solved').length,progress:items.filter(x=>x.status==='In Progress').length,attempted:items.filter(x=>x.status==='Attempted').length}),[items]);
 const percent=stats.total?Math.round(stats.solved/stats.total*100):0;
 const save=(data)=>{if(data.id){setItems(prev=>prev.map(x=>x.id===data.id?data:x));setToast('Problem updated')}else{setItems(prev=>[{...data,id:Date.now()},...prev]);setToast('Problem added')}setEditing(null)};
 const remove=(id)=>{setItems(prev=>prev.filter(x=>x.id!==id));setToast('Problem removed')};
 const reset=()=>{setItems(seed);setToast('Sample data restored')};
 const exportCsv=()=>{const header=['Title','Topic','Language','Difficulty','Platform','Status','Solved Date','Notes'];const rows=items.map(x=>[x.title,x.topic,x.language,x.difficulty,x.platform,x.status,x.date,x.notes]);const esc=v=>`"${String(v||'').replaceAll('"','""')}"`;const csv=[header,...rows].map(r=>r.map(esc).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='codetrack-problems.csv';a.click();URL.revokeObjectURL(a.href);setToast('CSV exported')};
 return <div className="app"><Sidebar view={view} setView={setView}/><main className="main">
   {view==='dashboard'&&<Dashboard items={items} stats={stats} percent={percent} setView={setView} />}
   {view==='problems'&&<Problems items={items} onEdit={setEditing} onDelete={remove} onAdd={()=>setEditing({...blank})} onExport={exportCsv} />}
   {view==='analytics'&&<Analytics items={items} stats={stats} percent={percent}/>}<div className="footer">Task 2 · Problem 43 · ReactJS Coding Practice Tracker</div>
 </main>{editing&&<ProblemForm initial={editing} onClose={()=>setEditing(null)} onSave={save}/>} {toast&&<div className="toast">{toast}</div>}</div>
}
function Sidebar({view,setView}){return <aside className="sidebar"><div className="brand">Code<span>Track</span></div><div className="nav">{[['dashboard','Dashboard'],['problems','Problem Log'],['analytics','Analytics']].map(([id,label])=><button key={id} className={view===id?'active':''} onClick={()=>setView(id)}>{label}</button>)}</div><div className="side-note">An individual ReactJS assignment built around problem statement 43: Coding Practice Tracker.</div></aside>}
function Header({kicker,title,subtitle,children}){return <div className="top"><div><div className="kicker">{kicker}</div><h1 className="title">{title}</h1><p className="subtitle">{subtitle}</p></div><div className="actions">{children}</div></div>}
function Dashboard({items,stats,percent,setView}){const recent=items.slice(0,5);return <><Header kicker="Task 2 · Interactive ReactJS" title="Your coding practice, in one place." subtitle="Log problems, keep status visible, and use the analytics view to see where practice time is going."><button className="btn" onClick={()=>setView('problems')}>Open problem log</button></Header><section className="grid stats"><Stat label="Problems" value={stats.total} note="Logged in tracker"/><Stat label="Solved" value={stats.solved} note={`${percent}% of total`} good/><Stat label="In progress" value={stats.progress} note="Needs another pass"/><Stat label="Attempted" value={stats.attempted} note="Not yet marked solved"/></section><section className="grid two"><div className="card"><h2 className="section-title">Recent practice</h2><div className="list">{recent.length?recent.map(x=><div className="row" key={x.id}><div className="row-main"><strong>{x.title}</strong><span>{x.platform} · {x.topic} · {x.language}</span></div><StatusTag status={x.status}/></div>):<div className="empty">No problems yet. Add your first one from the Problem Log.</div>}</div></div><div className="card"><h2 className="section-title">Solved progress</h2><div className="ring" style={{'--p':percent}}><div className="ring-inner"><div className="ring-value">{percent}%</div><div className="ring-label">solved</div></div></div><p className="muted" style={{textAlign:'center',margin:0}}>{stats.solved} solved out of {stats.total} logged problems.</p></div></section></>}
function Stat({label,value,note,good}){return <div className="card"><div className="stat-label">{label}</div><div className="stat-value">{value}</div><div className="stat-meta" style={good?{color:'var(--good)'}:{}}>{note}</div></div>}
function Problems({items,onEdit,onDelete,onAdd,onExport}){const [q,setQ]=useState('');const [status,setStatus]=useState('All');const [difficulty,setDifficulty]=useState('All');const [language,setLanguage]=useState('All');const [sort,setSort]=useState('Recent');const filtered=useMemo(()=>items.filter(x=>{const s=(x.title+' '+x.topic+' '+x.platform).toLowerCase();return (!q||s.includes(q.toLowerCase()))&&(status==='All'||x.status===status)&&(difficulty==='All'||x.difficulty===difficulty)&&(language==='All'||x.language===language)}).sort((a,b)=>sort==='Title'?a.title.localeCompare(b.title):b.id-a.id),[items,q,status,difficulty,language,sort]);return <><Header kicker="Problem log" title="Practice entries" subtitle="Search and filter the log, then add, edit, or remove entries as your practice set changes."><button className="btn" onClick={onExport}>Export CSV</button><button className="btn primary" onClick={onAdd}>+ Add problem</button></Header><div className="card"><div className="toolbar"><input className="input search" placeholder="Search title, topic, or platform" value={q} onChange={e=>setQ(e.target.value)}/><select className="select" value={status} onChange={e=>setStatus(e.target.value)}><option>All</option><option>Solved</option><option>In Progress</option><option>Attempted</option></select><select className="select" value={difficulty} onChange={e=>setDifficulty(e.target.value)}><option>All</option><option>Easy</option><option>Medium</option><option>Hard</option></select><select className="select" value={language} onChange={e=>setLanguage(e.target.value)}><option>All</option><option>C++</option><option>JavaScript</option><option>Java</option><option>Python</option></select><select className="select" value={sort} onChange={e=>setSort(e.target.value)}><option>Recent</option><option>Title</option></select></div><div className="table-wrap"><table><thead><tr><th>Problem</th><th>Topic</th><th>Language</th><th>Difficulty</th><th>Status</th><th>Practice date</th><th></th></tr></thead><tbody>{filtered.length?filtered.map(x=><tr key={x.id}><td><strong>{x.title}</strong><div className="muted" style={{fontSize:11,marginTop:3}}>{x.platform}</div></td><td>{x.topic||'—'}</td><td>{x.language}</td><td><StatusTag status={x.difficulty}/></td><td><StatusTag status={x.status}/></td><td>{x.date||'—'}</td><td><div className="table-actions"><button className="btn small" onClick={()=>onEdit({...x})}>Edit</button><button className="btn small danger" onClick={()=>onDelete(x.id)}>Delete</button></div></td></tr>):<tr><td colSpan="7" className="empty">No entries match those filters.</td></tr>}</tbody></table></div></div></>}
function StatusTag({status}){const cls=status==='Solved'||status==='Easy'?'good':status==='In Progress'||status==='Medium'?'warn':status==='Hard'||status==='Attempted'?'bad':'';return <span className={'tag '+cls}>{status}</span>}
function ProblemForm({initial,onClose,onSave}){const [data,setData]=useState(initial);const [errors,setErrors]=useState({});const change=(k,v)=>setData(d=>({...d,[k]:v}));const submit=e=>{e.preventDefault();const er={};if(!data.title.trim())er.title='Enter a problem title.';if(!data.topic.trim())er.topic='Enter a topic.';if(data.status==='Solved'&&!data.date)er.date='Add the date for a solved problem.';if(data.date&&data.date>'2026-09-30')er.date='Date cannot be in the future.';setErrors(er);if(!Object.keys(er).length)onSave({...data,title:data.title.trim(),topic:data.topic.trim(),notes:data.notes.trim()})};return <div className="modal-backdrop"><div className="modal"><div className="modal-head"><div><div className="kicker">{data.id?'Edit entry':'New entry'}</div><h2>{data.id?'Update problem':'Add a problem'}</h2></div><button className="btn small" onClick={onClose}>Close</button></div><form onSubmit={submit}><div className="form-grid"><Field label="Problem title" error={errors.title}><input className="input" value={data.title} onChange={e=>change('title',e.target.value)} placeholder="e.g. Binary Search"/></Field><Field label="Topic" error={errors.topic}><input className="input" value={data.topic} onChange={e=>change('topic',e.target.value)} placeholder="e.g. Searching"/></Field><Field label="Language"><select className="select" value={data.language} onChange={e=>change('language',e.target.value)}><option>C++</option><option>JavaScript</option><option>Java</option><option>Python</option></select></Field><Field label="Difficulty"><select className="select" value={data.difficulty} onChange={e=>change('difficulty',e.target.value)}><option>Easy</option><option>Medium</option><option>Hard</option></select></Field><Field label="Platform"><select className="select" value={data.platform} onChange={e=>change('platform',e.target.value)}><option>LeetCode</option><option>CodeChef</option><option>Codeforces</option><option>HackerRank</option><option>Other</option></select></Field><Field label="Status"><select className="select" value={data.status} onChange={e=>change('status',e.target.value)}><option>In Progress</option><option>Attempted</option><option>Solved</option></select></Field><Field label="Solved / practice date" error={errors.date}><input className="input" type="date" value={data.date} onChange={e=>change('date',e.target.value)}/></Field><Field label="Notes" full><textarea className="textarea" value={data.notes} onChange={e=>change('notes',e.target.value)} placeholder="What did you learn or need to revisit?"/></Field></div><div className="modal-foot"><button type="button" className="btn" onClick={onClose}>Cancel</button><button type="submit" className="btn primary">Save entry</button></div></form></div></div>}
function Field({label,error,children,full}){return <div className={'field '+(full?'full':'')}><label>{label}</label>{children}{error&&<div className="error">{error}</div>}</div>}
function Analytics({items,stats,percent}){const byDifficulty=['Easy','Medium','Hard'].map(d=>({label:d,value:items.filter(x=>x.difficulty===d).length}));const byLanguage=['C++','JavaScript','Java','Python'].map(l=>({label:l,value:items.filter(x=>x.language===l).length}));const max=Math.max(1,...byDifficulty.map(x=>x.value),...byLanguage.map(x=>x.value));return <><Header kicker="Analytics" title="Practice patterns" subtitle="A small set of calculations over the local problem log. Values update immediately when entries change."/><section className="grid stats"><Stat label="Solved rate" value={`${percent}%`} note="Solved ÷ total" good/><Stat label="Total" value={stats.total} note="All logged problems"/><Stat label="Open work" value={stats.progress} note="In progress"/><Stat label="Attempted" value={stats.attempted} note="Needs another decision"/></section><section className="grid two"><div className="card"><h2 className="section-title">By difficulty</h2><div className="chart-list">{byDifficulty.map(x=><Bar key={x.label} item={x} max={max}/>)}</div></div><div className="card"><h2 className="section-title">By language</h2><div className="chart-list">{byLanguage.map(x=><Bar key={x.label} item={x} max={max}/>)}</div></div></section></>}
function Bar({item,max}){return <div className="bar-line"><span>{item.label}</span><div className="bar"><span style={{width:`${item.value/max*100}%`}}/></div><strong>{item.value}</strong></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
